aid: conductorone
name: ConductorOne
description: ConductorOne (now branded C1) is an identity security and access governance platform that
  automates access reviews, just-in-time access requests, provisioning, role mining, and least-privilege
  enforcement across 400+ connected apps and cloud infrastructure, plus governance of AI/MCP access. Its
  HTTP API lets teams manage apps, entitlements, users, access reviews, automations, connectors, policies,
  and audit data, and integrate identity security directly into internal tools and developer workflows.
  The API is documented with a full OpenAPI 3.1 spec and backed by Go and TypeScript SDKs, a Terraform
  provider, a Postman collection, and the c1i/cone command-line tools.
